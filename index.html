<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tile Master — Pixi Port</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #10131a; overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Center the game and keep it at the original 750:1334 aspect ratio. */
    #game {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #game canvas {
      /* JS sets the pixel dimensions; these preserve the aspect ratio. */
      display: block;
    }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #cdd6e6; font-size: 20px; letter-spacing: .5px; z-index: 10;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loading">Loading…</div>
  <script src="vendor/pixi.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
