<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tile Match 3 — Pixi Port</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #10131a; overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* The canvas fills the whole viewport; the game reflows to fit any aspect
       ratio in JS (main.js resize + each scene's layout()), so there are no
       letterbox bars to center around. */
    #game {
      position: fixed; inset: 0;
    }
    #game canvas {
      display: block;
    }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #cdd6e6; font-size: 20px; letter-spacing: .5px; z-index: 10;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loading">Loading…</div>
  <script src="vendor/pixi.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
