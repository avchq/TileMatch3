<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tile Match 3 — Pixi Port</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #10131a; overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* The canvas fills the whole viewport; the game reflows to fit any aspect
       ratio in JS (main.js resize + each scene's layout()), so there are no
       letterbox bars to center around. */
    #game {
      position: fixed; inset: 0;
    }
    #game canvas {
      display: block;
    }
    /* Splash screen: shown from the very first paint (before pixi.min.js and the
       ES modules have even parsed) until boot() finishes, so it covers the whole
       of loading. src/splash.js drives the bar; main.js fades it out and hands
       over to the first scene. Pure CSS — no images, no web fonts — so it costs
       no network request of its own. */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 80% at 50% 35%, #1b2130 0%, #10131a 70%);
      color: #cdd6e6;
      opacity: 1; transition: opacity .25s ease-out;
    }
    /* Fading out: stop swallowing taps immediately, not when the fade ends. */
    #splash.hiding { opacity: 0; pointer-events: none; }
    #splash .splash-inner {
      width: min(78vw, 420px);
      display: flex; flex-direction: column; align-items: center;
    }
    #splash .splash-title {
      margin: 0 0 28px; font-size: clamp(26px, 7vw, 40px); font-weight: 700;
      letter-spacing: 1px; color: #f4e6c8;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .35);
    }
    #splash .splash-track {
      width: 100%; height: 12px; border-radius: 6px; overflow: hidden;
      background: #232a38; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .5);
    }
    #splash-fill {
      width: 0; height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, #ffb347, #ffd964);
      transition: width .18s ease-out;
    }
    #splash .splash-meta {
      width: 100%; margin-top: 12px;
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 14px; letter-spacing: .5px; color: #8f9bb3;
    }
    #splash-pct { font-variant-numeric: tabular-nums; }
    /* Boot failed: the splash stays up and shows why, instead of leaving a blank
       screen. The bar is hidden — there is no progress left to report. */
    #splash.error .splash-track { visibility: hidden; }
    #splash.error #splash-pct { visibility: hidden; }
    #splash.error #splash-status { color: #ff8a80; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="splash">
    <div class="splash-inner">
      <h1 class="splash-title">Tile Match 3</h1>
      <div class="splash-track"><div id="splash-fill"></div></div>
      <div class="splash-meta">
        <span id="splash-status">Starting up…</span>
        <span id="splash-pct">0%</span>
      </div>
    </div>
  </div>
  <script>
    // BOOT ERROR SURFACE — a classic inline script, so it is already running
    // before any module is fetched and keeps working when the module graph dies.
    //
    // boot()'s own .catch() in src/main.js can only see errors thrown INSIDE
    // boot(). A syntax error, a failed import, or a throw at module scope kills
    // the graph before boot() is ever defined — and without this the splash just
    // sits at "Starting up… 0%" with nothing on screen or in the console UI to
    // say why. (That is exactly how a stale cached module once bricked the game
    // on a phone while the desktop was fine.) Paints the same `.error` state
    // src/splash.js's fail() uses, so there is one visual failure state.
    (function () {
      var shown = false;
      function showBootError(what) {
        // Only ever speak for a boot that never finished. Once window.__game
        // exists the game is up and running, and a later stray error must not
        // slam a red overlay across a live session.
        if (shown || window.__game) return;
        shown = true;
        var el = document.getElementById("splash");
        var status = document.getElementById("splash-status");
        if (!el || !status) return;
        el.classList.remove("hiding");
        el.style.display = "";
        el.classList.add("error");
        status.textContent = "Error: " + (
          (what && what.message) || String(what == null ? "failed to start" : what));
      }
      addEventListener("error", function (e) {
        // Ignore sub-resource load failures (a missing image is not a dead boot);
        // only script/module errors carry an `error` or a `message`.
        if (e.target && e.target !== window && e.target.tagName) {
          if (e.target.tagName !== "SCRIPT") return;
          return showBootError("could not load " + (e.target.src || "a script"));
        }
        showBootError(e.error || e.message);
      }, true);
      addEventListener("unhandledrejection", function (e) { showBootError(e.reason); });
    })();
  </script>
  <script src="vendor/pixi.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
